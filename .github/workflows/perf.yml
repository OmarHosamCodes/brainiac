name: Performance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: orch
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/orch
      BETTER_AUTH_SECRET: perf-benchmark-secret-key-32chars!
      BETTER_AUTH_URL: http://localhost:7001
      CORS_ORIGIN: http://localhost:7001
      VITE_PUBLIC_SERVER_URL: http://localhost:7001
      NODE_ENV: production
      PORT: "7001"
      INTERNAL_API_PORT: "3001"
      PERF_BASE_URL: http://localhost:7001
      PERF_AUDIT_RUNS: "3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps

      - name: Run performance benchmarks
        run: bun run perf:ci

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: |
            apps/web/perf/perf-report.json
            apps/web/perf/perf-report.md
          if-no-files-found: warn
