<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- dark theme: background oklch(0.15 0.02 269.18), primary oklch(0.922 0 0) — tracking pulse -->
  <style>
    .pulse {
      transform-origin: 22px 20px;
      animation: tracking-pulse 1.2s ease-in-out infinite;
    }
    @keyframes tracking-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.7; }
    }
  </style>
  <rect width="32" height="32" rx="8" fill="#080b14"/>
  <path d="M10 12h12M10 16h8M10 20h10" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round"/>
  <circle class="pulse" cx="22" cy="20" r="2" fill="#e5e5e5"/>
</svg>
