info:
  name: Editor Saves Own Team Node
  type: http
  seq: 10

http:
  method: POST
  url: "{{rpcBaseUrl}}/workspace/save"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "nodes": [
            {
              "id": "{{opsSharedNodeId}}",
              "title": "Editor Shared Node {{testRunId}}",
              "content": "",
              "ownerUserId": "{{editorUserId}}",
              "visibility": "team",
              "teamId": "{{teamId}}",
              "x": 120,
              "y": 180,
              "width": 520,
              "height": 360,
              "label": "Editor Shared",
              "minWidth": 280,
              "minHeight": 200,
              "createdAt": "2026-01-01T00:00:00.000Z",
              "updatedAt": "2026-01-01T00:00:00.000Z",
              "tabs": [
                {
                  "id": "tab-editor-shared-{{testRunId}}",
                  "title": "Overview",
                  "blocks": [
                    {
                      "id": "block-editor-shared-{{testRunId}}",
                      "type": "notes",
                      "title": "Notes",
                      "body": "Editor shared note",
                      "createdAt": "2026-01-01T00:00:00.000Z",
                      "updatedAt": "2026-01-01T00:00:00.000Z"
                    }
                  ],
                  "createdAt": "2026-01-01T00:00:00.000Z",
                  "updatedAt": "2026-01-01T00:00:00.000Z"
                }
              ],
              "customBlockTemplates": [],
              "viewState": {
                "activeTabId": "tab-editor-shared-{{testRunId}}",
                "notePreviewState": {}
              },
              "dashboard": {
                "tint": "neutral",
                "featuredBlocks": []
              }
            }
          ]
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Editor can save team-visible own node", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.nodeCount).to.equal(1);
        });
