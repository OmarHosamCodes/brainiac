info:
  name: Editor Deletes Owner Shared Node
  type: http
  seq: 11

http:
  method: POST
  url: "{{rpcBaseUrl}}/workspace/deleteNode"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "nodeId": "{{founderSharedNodeId}}",
          "ownerUserId": "{{ownerUserId}}"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Editor can delete shared node from owner workspace", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.nodeId).to.equal(bru.getVar("founderSharedNodeId"));
          expect(res.body.json.ownerUserId).to.equal(bru.getVar("ownerUserId"));
          expect(res.body.json.deleted).to.equal(true);
        });
