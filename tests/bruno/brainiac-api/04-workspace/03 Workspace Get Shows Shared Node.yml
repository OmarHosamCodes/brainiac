info:
  name: Workspace Get Shows Shared Node
  type: http
  seq: 3

http:
  method: POST
  url: "{{rpcBaseUrl}}/workspace/get"
  body:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("Owner snapshot includes private and team nodes", function() {
          expect(res.status).to.equal(200);

          const nodes = res.body.json.nodes;
          const privateNodeId = bru.getVar("founderPrivateNodeId");
          const sharedNodeId = bru.getVar("founderSharedNodeId");

          const privateNode = nodes.find((node) => node.id === privateNodeId && node.ownerUserId === bru.getVar("ownerUserId"));
          const sharedNode = nodes.find((node) => node.id === sharedNodeId && node.ownerUserId === bru.getVar("ownerUserId"));

          expect(privateNode).to.be.an("object");
          expect(privateNode.visibility).to.equal("private");
          expect(sharedNode).to.be.an("object");
          expect(sharedNode.visibility).to.equal("team");
          expect(sharedNode.teamId).to.equal(bru.getVar("teamId"));
        });
