info:
  name: Workspace Save Owner Nodes
  type: http
  seq: 2

http:
  method: POST
  url: "{{rpcBaseUrl}}/workspace/save"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "nodes": [
            {
              "id": "{{founderPrivateNodeId}}",
              "title": "Bruno Private Node {{testRunId}}",
              "content": "",
              "ownerUserId": "{{ownerUserId}}",
              "visibility": "private",
              "teamId": null,
              "x": 10,
              "y": 20,
              "width": 520,
              "height": 360,
              "label": "Private",
              "minWidth": 280,
              "minHeight": 200,
              "createdAt": "2026-01-01T00:00:00.000Z",
              "updatedAt": "2026-01-01T00:00:00.000Z",
              "tabs": [
                {
                  "id": "tab-private-{{testRunId}}",
                  "title": "Overview",
                  "blocks": [
