runtime:
  scripts:
    - type: tests
      code: |-
        test("Owner can save workspace nodes", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.nodeCount).to.equal(2);
          expect(res.body.json.savedAt).to.be.a("string");
        });
