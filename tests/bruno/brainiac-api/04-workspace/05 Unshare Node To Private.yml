info:
  name: Unshare Node To Private
  type: http
  seq: 5

http:
  method: POST
  url: "{{rpcBaseUrl}}/workspace/unshareNode"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "nodeId": "{{founderPrivateNodeId}}"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Owner can unshare node", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.nodeId).to.equal(bru.getVar("founderPrivateNodeId"));
          expect(res.body.json.visibility).to.equal("private");
        });
