info:
  name: Delete Owner Private Node
  type: http
  seq: 6

http:
  method: POST
  url: "{{rpcBaseUrl}}/workspace/deleteNode"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "nodeId": "{{founderPrivateNodeId}}"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Owner can delete own node", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.nodeId).to.equal(bru.getVar("founderPrivateNodeId"));
          expect(res.body.json.ownerUserId).to.equal(bru.getVar("ownerUserId"));
          expect(res.body.json.deleted).to.equal(true);
        });
