info:
  name: Get Session After Sign Out
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/auth/get-session"
  headers:
    - name: origin
      value: "{{baseUrl}}"
  body:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("Session is cleared", function() {
          expect([200, 401]).to.include(res.status);

          if (res.status === 200) {
            expect(res.body).to.satisfy((value) => value === null || typeof value === "object");
          }
        });
