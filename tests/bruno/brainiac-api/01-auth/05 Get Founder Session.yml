info:
  name: Get Random User Session
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/auth/get-session"
  headers:
    - name: origin
      value: "{{baseUrl}}"
  body:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("Random user session exists", function() {
          expect(res.status).to.equal(200);
          expect(res.body).to.be.an("object");
          expect(res.body.user).to.be.an("object");
          expect(res.body.user.id).to.be.a("string");
          expect(res.body.user.email).to.equal(bru.getVar("randomSignupEmail"));

          bru.setVar("founderUserId", res.body.user.id);
        });
