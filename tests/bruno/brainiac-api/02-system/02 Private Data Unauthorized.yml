info:
  name: Private Data Unauthorized
  type: http
  seq: 2

http:
  method: POST
  url: "{{rpcBaseUrl}}/privateData"
  body:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("privateData blocks anonymous users", function() {
          expect([401, 403]).to.include(res.status);

          if (res.body && res.body.json && res.body.json.code) {
            expect(res.body.json.code).to.equal("UNAUTHORIZED");
          }
        });
