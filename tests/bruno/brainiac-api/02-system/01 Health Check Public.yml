info:
  name: Health Check Public
  type: http
  seq: 1

http:
  method: POST
  url: "{{rpcBaseUrl}}/healthCheck"
  body:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("healthCheck returns OK", function() {
          expect(res.status).to.equal(200);
          expect(res.body).to.be.an("object");
          expect(res.body.json).to.equal("OK");
        });
