runtime:
  scripts:
    - type: tests
      code: |-
        test("privateData returns session user", function() {
          expect(res.status).to.equal(200);
          expect(res.body).to.be.an("object");
          expect(res.body.json).to.be.an("object");
          expect(res.body.json.user).to.be.an("object");
          expect(res.body.json.user.id).to.be.a("string");

          bru.setVar("founderUserId", res.body.json.user.id);
        });
