info:
  name: Sign Up Editor
  type: http
  seq: 7
http:
  method: POST
  url: "{{baseUrl}}/api/auth/sign-up/email"
  headers:
    - name: content-type
      value: application/json
    - name: origin
      value: "{{baseUrl}}"
  body:
    type: json
    data: |-
      {
        "name": "Bruno Editor",
        "email": "{{editorEmail}}",
        "password": "{{seedPassword}}"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Editor signup succeeds", function() {
          expect([200, 201]).to.include(res.status);
          expect(res.body).to.be.an("object");
          expect(res.body.user).to.be.an("object");
          expect(res.body.user.id).to.be.a("string");

          bru.setVar("editorUserId", res.body.user.id);
        });
