info:
  name: Editor Cannot Add Member
  type: http
  seq: 18
http:
  method: POST
  url: "{{rpcBaseUrl}}/team/members/add"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "userEmail": "{{viewerEmail}}",
          "role": "viewer"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Non-owner cannot add members", function() {
          expect([401, 403]).to.include(res.status);
          if (res.body && res.body.json && res.body.json.code) {
            expect(res.body.json.code).to.equal("UNAUTHORIZED");
          }
        });
