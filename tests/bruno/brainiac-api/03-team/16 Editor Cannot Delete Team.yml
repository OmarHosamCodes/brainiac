  type: http
  seq: 20
http:
  method: POST
  url: "{{rpcBaseUrl}}/team/delete"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Non-owner cannot delete team", function() {
          expect([401, 403]).to.include(res.status);
        });
