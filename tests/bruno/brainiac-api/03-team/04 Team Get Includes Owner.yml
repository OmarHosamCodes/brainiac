info:
  name: Team Get Includes Owner
  type: http
  seq: 5
http:
  method: POST
  url: "{{rpcBaseUrl}}/team/get"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Owner can fetch team details", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.id).to.equal(bru.getVar("teamId"));
          expect(res.body.json.members).to.be.an("array");

          const ownerUserId = bru.getVar("ownerUserId");
          const ownerMember = res.body.json.members.find((member) => member.userId === ownerUserId);

          expect(ownerMember).to.be.an("object");
          expect(ownerMember.role).to.equal("owner");
        });
