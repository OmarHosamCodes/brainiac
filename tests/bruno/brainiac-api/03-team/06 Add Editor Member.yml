info:
  name: Add Editor Member
  type: http
  seq: 10
http:
  method: POST
  url: "{{rpcBaseUrl}}/team/members/add"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "userEmail": "{{editorEmail}}",
          "role": "editor"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Owner can add editor member", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.userEmail).to.equal(bru.getVar("editorEmail"));
          expect(res.body.json.role).to.equal("editor");

          bru.setVar("editorUserId", res.body.json.userId);
        });
