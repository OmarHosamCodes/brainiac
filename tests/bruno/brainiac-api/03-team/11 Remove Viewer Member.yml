info:
  name: Remove Viewer Member
  type: http
  seq: 15
http:
  method: POST
  url: "{{rpcBaseUrl}}/team/members/remove"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "userId": "{{viewerUserId}}"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Owner can remove member", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.userId).to.equal(bru.getVar("viewerUserId"));
          expect(res.body.json.removed).to.equal(true);
        });
