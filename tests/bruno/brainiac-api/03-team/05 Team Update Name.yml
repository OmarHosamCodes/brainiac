info:
  name: Team Update Name
  type: http
  seq: 6
http:
  method: POST
  url: "{{rpcBaseUrl}}/team/update"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "name": "Bruno Team Renamed {{testRunId}}"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Owner can rename team", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.id).to.equal(bru.getVar("teamId"));
          expect(res.body.json.name).to.contain("Renamed");
        });
