info:
  name: Add Viewer Member
  type: http
  seq: 11
http:
  method: POST
  url: "{{rpcBaseUrl}}/team/members/add"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "userEmail": "{{viewerEmail}}",
          "role": "viewer"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Owner can add viewer member", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.userEmail).to.equal(bru.getVar("viewerEmail"));
          expect(res.body.json.role).to.equal("viewer");

          bru.setVar("viewerUserId", res.body.json.userId);
        });
