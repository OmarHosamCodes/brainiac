info:
  name: Create Team As Owner
  type: http
  seq: 3
http:
  method: POST
  url: "{{rpcBaseUrl}}/team/create"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "name": "Bruno Team {{testRunId}}"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Team creation succeeds", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.id).to.be.a("string");
          expect(res.body.json.name).to.contain("Bruno Team");
          expect(res.body.json.role).to.equal("owner");

          bru.setVar("teamId", res.body.json.id);
        });
