info:
  name: Prevent Last Owner Self Demotion
  type: http
  seq: 14
http:
  method: POST
  url: "{{rpcBaseUrl}}/team/members/updateRole"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "userId": "{{ownerUserId}}",
          "role": "viewer"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Cannot demote the last owner", function() {
          expect([400, 409]).to.include(res.status);

          if (res.body && res.body.json && res.body.json.code) {
            expect(res.body.json.code).to.equal("BAD_REQUEST");
          }
        });
