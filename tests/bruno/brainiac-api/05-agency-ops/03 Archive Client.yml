info:
  name: Archive Client
  type: http
  seq: 3

http:
  method: POST
  url: "{{rpcBaseUrl}}/agencyOps/clients/update"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "clientId": "{{clientId}}",
          "status": "archived"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Owner archives client", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.status).to.equal("archived");
          expect(res.body.json.archivedAt).to.be.a("string");
        });
