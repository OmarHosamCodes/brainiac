info:
  name: Create Client As Owner
  type: http
  seq: 1

http:
  method: POST
  url: "{{rpcBaseUrl}}/agencyOps/clients/create"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "name": "Bruno Client {{testRunId}}",
          "brandColor": "1E40AF"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Owner creates client", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.id).to.be.a("string");
          expect(res.body.json.brandColor).to.equal("#1E40AF");

          bru.setVar("clientId", res.body.json.id);
        });
