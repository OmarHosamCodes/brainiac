info:
  name: Update Sprint Item
  type: http
  seq: 18

http:
  method: POST
  url: "{{rpcBaseUrl}}/agencyOps/sprintItems/update"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "sprintItemId": "{{sprintItemId}}",
          "status": "doing",
          "estimateMinutes": 120
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Sprint item updates", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.status).to.equal("doing");
          expect(res.body.json.estimateMinutes).to.equal(120);
        });
