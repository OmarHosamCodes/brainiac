info:
  name: List Projects Excludes Archived
  type: http
  seq: 10

http:
  method: POST
  url: "{{rpcBaseUrl}}/agencyOps/projects/list"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "includeArchived": false
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Archived project hidden by default", function() {
          expect(res.status).to.equal(200);
          const found = res.body.json.items.find((item) => item.id === bru.getVar("projectId"));
          expect(found).to.equal(undefined);
        });
