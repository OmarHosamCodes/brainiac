info:
  name: Create Manual Time Entry
  type: http
  seq: 22

http:
  method: POST
  url: "{{rpcBaseUrl}}/agencyOps/timeEntries/createManual"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "sprintItemId": "{{sprintItemId}}",
          "startAt": "{{manualStartAt}}",
          "endAt": "{{manualEndAt}}",
          "description": "Manual owner entry"
        }
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        const end = new Date();
        const start = new Date(end.getTime() - 60 * 60 * 1000);
        const stop = new Date(end.getTime() - 30 * 60 * 1000);

        bru.setVar("manualStartAt", start.toISOString());
        bru.setVar("manualEndAt", stop.toISOString());
      
    - type: tests
      code: |-
        test("Manual time entry is created", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.id).to.be.a("string");
          expect(res.body.json.source).to.equal("manual");

          bru.setVar("manualEntryId", res.body.json.id);
        });
