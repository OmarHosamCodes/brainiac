info:
  name: Reports Summary
  type: http
  seq: 26

http:
  method: POST
  url: "{{rpcBaseUrl}}/agencyOps/reports/summary"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "from": "{{reportFrom}}",
          "to": "{{reportTo}}"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Owner can fetch reports summary", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.summary).to.be.an("object");
          expect(res.body.json.summary.totalEntries).to.be.a("number");
        });
