info:
  name: Reports Csv Export
  type: http
  seq: 27

http:
  method: POST
  url: "{{rpcBaseUrl}}/agencyOps/reports/exportCsv"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "from": "{{reportFrom}}",
          "to": "{{reportTo}}"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Owner can export CSV", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.contentType).to.equal("text/csv");
          expect(res.body.json.csv).to.be.a("string");
          expect(res.body.json.csv).to.include("entry_id,date,started_at");
        });
