info:
  name: Reject Invalid Manual Entry Range
  type: http
  seq: 23

http:
  method: POST
  url: "{{rpcBaseUrl}}/agencyOps/timeEntries/createManual"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "sprintItemId": "{{sprintItemId}}",
          "startAt": "{{manualEndAt}}",
          "endAt": "{{manualStartAt}}",
          "description": "Invalid range"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Invalid manual range is rejected", function() {
          expect([400, 422]).to.include(res.status);
        });
