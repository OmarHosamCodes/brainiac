info:
  name: Start Timer
  type: http
  seq: 19

http:
  method: POST
  url: "{{rpcBaseUrl}}/agencyOps/timer/start"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "sprintItemId": "{{sprintItemId}}",
          "description": "Timer started by owner"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Timer starts", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.timer).to.be.an("object");
          expect(res.body.json.timer.sprintItemId).to.equal(bru.getVar("sprintItemId"));
        });
