info:
  name: Delete Manual Time Entry
  type: http
  seq: 29

http:
  method: POST
  url: "{{rpcBaseUrl}}/agencyOps/timeEntries/deleteMine"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "entryId": "{{manualEntryId}}"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Owner can soft delete manual entry", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.entryId).to.equal(bru.getVar("manualEntryId"));
          expect(res.body.json.deleted).to.equal(true);
        });
