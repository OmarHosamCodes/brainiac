info:
  name: Archive Project
  type: http
  seq: 9

http:
  method: POST
  url: "{{rpcBaseUrl}}/agencyOps/projects/update"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "projectId": "{{projectId}}",
          "archived": true
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Owner archives project", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.archivedAt).to.be.a("string");
        });
