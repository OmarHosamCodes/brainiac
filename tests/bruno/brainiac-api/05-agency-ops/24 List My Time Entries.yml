info:
  name: List My Time Entries
  type: http
  seq: 24

http:
  method: POST
  url: "{{rpcBaseUrl}}/agencyOps/timeEntries/listMine"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "page": 1,
          "pageSize": 10,
          "anchorDate": "{{reportTo}}"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Time entry list includes manual entry and summary", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.items).to.be.an("array");
          expect(res.body.json.weekSummary).to.be.an("object");
          expect(res.body.json.total).to.be.a("number");

          const found = res.body.json.items.find((item) => item.id === bru.getVar("manualEntryId"));
          expect(found).to.be.an("object");
        });
