info:
  name: Stop Timer
  type: http
  seq: 21

http:
  method: POST
  url: "{{rpcBaseUrl}}/agencyOps/timer/stop"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "description": "Timer stopped by owner"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Stopping timer creates entry", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.timer).to.equal(null);
          expect(res.body.json.createdEntry).to.be.an("object");
          expect(res.body.json.createdEntry.source).to.equal("timer");
        });
