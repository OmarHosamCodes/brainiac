info:
  name: Unarchive And Update Client
  type: http
  seq: 6

http:
  method: POST
  url: "{{rpcBaseUrl}}/agencyOps/clients/update"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "clientId": "{{clientId}}",
          "name": "Bruno Client Active {{testRunId}}",
          "brandColor": "#0EA5E9",
          "status": "active"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Owner unarchives and updates client", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.status).to.equal("active");
          expect(res.body.json.archivedAt).to.equal(null);
          expect(res.body.json.brandColor).to.equal("#0EA5E9");
        });
