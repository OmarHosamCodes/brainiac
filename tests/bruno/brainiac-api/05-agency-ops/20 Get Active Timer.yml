info:
  name: Get Active Timer
  type: http
  seq: 20

http:
  method: POST
  url: "{{rpcBaseUrl}}/agencyOps/timer/getActive"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Active timer is returned", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.timer).to.be.an("object");
          expect(res.body.json.timer.teamId).to.equal(bru.getVar("teamId"));
        });
