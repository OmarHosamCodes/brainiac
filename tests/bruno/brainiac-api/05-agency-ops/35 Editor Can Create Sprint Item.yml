info:
  name: Editor Can Create Sprint Item
  type: http
  seq: 35

http:
  method: POST
  url: "{{rpcBaseUrl}}/agencyOps/sprintItems/create"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "sprintId": "{{sprintId}}",
          "projectId": "{{projectId}}",
          "title": "Editor task {{testRunId}}",
          "type": "task",
          "status": "todo"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Editor can create sprint item", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.id).to.be.a("string");
          expect(res.body.json.title).to.contain("Editor task");
        });
