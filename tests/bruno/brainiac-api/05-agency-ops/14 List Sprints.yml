info:
  name: List Sprints
  type: http
  seq: 14

http:
  method: POST
  url: "{{rpcBaseUrl}}/agencyOps/sprints/list"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "projectId": "{{projectId}}"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Sprint list includes created sprint", function() {
          expect(res.status).to.equal(200);
          const found = res.body.json.items.find((item) => item.id === bru.getVar("sprintId"));
          expect(found).to.be.an("object");
          expect(found.projectId).to.equal(bru.getVar("projectId"));
        });
