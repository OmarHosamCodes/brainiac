info:
  name: Create Sprint Item
  type: http
  seq: 16

http:
  method: POST
  url: "{{rpcBaseUrl}}/agencyOps/sprintItems/create"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "sprintId": "{{sprintId}}",
          "projectId": "{{projectId}}",
          "type": "task",
          "title": "Ship API regression suite {{testRunId}}",
          "description": "Created from Bruno",
          "status": "todo",
          "assigneeUserId": "{{editorUserId}}",
          "estimateMinutes": 90
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Sprint item created", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.id).to.be.a("string");
          expect(res.body.json.sprintId).to.equal(bru.getVar("sprintId"));

          bru.setVar("sprintItemId", res.body.json.id);
        });
