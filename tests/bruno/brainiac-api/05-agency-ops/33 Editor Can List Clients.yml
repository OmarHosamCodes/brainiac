info:
  name: Editor Can List Clients
  type: http
  seq: 33

http:
  method: POST
  url: "{{rpcBaseUrl}}/agencyOps/clients/list"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "includeArchived": true
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Editor can list clients", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.items).to.be.an("array");
        });
