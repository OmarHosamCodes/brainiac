info:
  name: List Clients
  type: http
  seq: 2

http:
  method: POST
  url: "{{rpcBaseUrl}}/agencyOps/clients/list"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Client list includes created client", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.items).to.be.an("array");

          const found = res.body.json.items.find((item) => item.id === bru.getVar("clientId"));
          expect(found).to.be.an("object");
          expect(found.status).to.equal("active");
        });
