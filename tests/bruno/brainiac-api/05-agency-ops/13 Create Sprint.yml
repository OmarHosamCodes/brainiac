info:
  name: Create Sprint
  type: http
  seq: 13

http:
  method: POST
  url: "{{rpcBaseUrl}}/agencyOps/sprints/create"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "projectId": "{{projectId}}",
          "name": "Sprint {{testRunId}}",
          "status": "planned",
          "startDate": "2026-01-01T00:00:00.000Z",
          "endDate": "2026-01-15T00:00:00.000Z"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Owner creates sprint", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.id).to.be.a("string");

          bru.setVar("sprintId", res.body.json.id);
        });
