info:
  name: Update Manual Time Entry
  type: http
  seq: 25

http:
  method: POST
  url: "{{rpcBaseUrl}}/agencyOps/timeEntries/updateMine"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "entryId": "{{manualEntryId}}",
          "description": "Manual owner entry updated"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Manual entry updates", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.id).to.equal(bru.getVar("manualEntryId"));
          expect(res.body.json.description).to.equal("Manual owner entry updated");
        });
