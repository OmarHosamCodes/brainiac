info:
  name: Create Project
  type: http
  seq: 7

http:
  method: POST
  url: "{{rpcBaseUrl}}/agencyOps/projects/create"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "clientId": "{{clientId}}",
          "name": "Bruno Project {{testRunId}}",
          "description": "Agency ops project from Bruno suite",
          "status": "active",
          "budgetMinutes": 600
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Owner creates project", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.id).to.be.a("string");
          expect(res.body.json.clientId).to.equal(bru.getVar("clientId"));

          bru.setVar("projectId", res.body.json.id);
        });
