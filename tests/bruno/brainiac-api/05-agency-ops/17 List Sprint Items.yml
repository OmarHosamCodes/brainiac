info:
  name: List Sprint Items
  type: http
  seq: 17

http:
  method: POST
  url: "{{rpcBaseUrl}}/agencyOps/sprintItems/list"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "sprintId": "{{sprintId}}"
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Sprint items list includes created item", function() {
          expect(res.status).to.equal(200);
          const found = res.body.json.items.find((item) => item.id === bru.getVar("sprintItemId"));
          expect(found).to.be.an("object");
          expect(found.assigneeUserId).to.equal(bru.getVar("editorUserId"));
        });
