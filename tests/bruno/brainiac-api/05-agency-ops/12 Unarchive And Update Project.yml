info:
  name: Unarchive And Update Project
  type: http
  seq: 12

http:
  method: POST
  url: "{{rpcBaseUrl}}/agencyOps/projects/update"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "json": {
          "teamId": "{{teamId}}",
          "projectId": "{{projectId}}",
          "description": "Updated description from Bruno suite",
          "status": "active",
          "budgetMinutes": 720,
          "archived": false
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Owner updates project", function() {
          expect(res.status).to.equal(200);
          expect(res.body.json.archivedAt).to.equal(null);
          expect(res.body.json.budgetMinutes).to.equal(720);
        });
